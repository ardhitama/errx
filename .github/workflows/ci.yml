name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-22.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.14.5"
            otp: "25.3"
          - elixir: "1.20.2"
            otp: "29.0.3"
            dialyzer: true

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.exs', 'mix.lock') }}

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.exs', 'mix.lock') }}

      - run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted || (mix format && git diff --exit-code)

      - name: Compile
        run: |
          set -o pipefail
          mix compile --warnings-as-errors 2>&1 | tee compile.log

      - name: Test
        run: |
          set -o pipefail
          mix test 2>&1 | tee test.log

      - run: mix credo --strict
      - run: mix hex.build

      - name: Dialyzer
        if: matrix.dialyzer == true
        run: |
          set -o pipefail
          {
            dialyzer --build_plt --output_plt .dialyzer_plt \
              --apps erts kernel stdlib compiler crypto parsetools
            elixir_ebin="$(elixir -e 'IO.puts(:code.lib_dir(:elixir, :ebin))')"
            dialyzer -Wno_unknown -pa "$elixir_ebin" \
              --add_to_plt --plt .dialyzer_plt "$elixir_ebin"
            dialyzer --no_check_plt -pa "$elixir_ebin" \
              --plt .dialyzer_plt _build/test/lib/errx/ebin
          } 2>&1 | tee dialyzer.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.elixir }}-${{ matrix.otp }}
          path: |
            compile.log
            test.log
            dialyzer.log
          if-no-files-found: ignore
